name: Claude Automated PR Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    name: AI Code Review
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r pr-reviewer/requirements.txt

      - name: Run Claude PR Reviewer Agent
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python -m pr_reviewer.cli \
            --pr "${{ github.event.pull_request.html_url }}" \
            --post-comment \
            --output review_output.md

      - name: Archive Review Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr-review-markdown
          path: review_output.md
